/* =========================================

toolList.forEach((t,i)=>{

div.className="tool"+(i===0?" active":"");

div.innerHTML="<b>"+t[1]+"</b>";

div.onclick=()=>selectTool(t[0],div);

/* =========================================
   CAMBIAR HERRAMIENTA
========================================= */

function selectTool(name,el){

document
.querySelectorAll(".tool")
.forEach(x=>x.classList.remove("active"));

el.classList.add("active");

title.innerText=
toolList.find(t=>t[0]===name)[1];

description.innerText=
configs[name][0];

form.innerHTML=
configs[name][1];

result.innerHTML=
"Esperando...";

radius();

textshadow();

/* =========================================
   HEX → RGB
========================================= */

function hexToRGB(hex){

hex=hex.replace("#","");

return{

r:parseInt(hex.substring(0,2),16),

g:parseInt(hex.substring(2,4),16),

b:parseInt(hex.substring(4,6),16)

};

}


/* =========================================
   RGB → HSL
========================================= */

function rgbToHSL(r,g,b){

r/=255;
g/=255;
b/=255;

const max=Math.max(r,g,b);

const min=Math.min(r,g,b);

let h=0;
let s=0;

const l=(max+min)/2;

if(max!==min){

const d=max-min;

s=l>0.5
?d/(2-max-min)
:d/(max+min);

switch(max){

case r:
h=(g-b)/d+(g<b?6:0);
break;

case g:
h=(b-r)/d+2;
break;

case b:
h=(r-g)/d+4;
break;

}

h/=6;

}

return[

Math.round(h*360),
Math.round(s*100),
Math.round(l*100)

];

}


/* =========================================
   HSL → RGB
========================================= */

function hslToRGB(h,s,l){

s/=100;
l/=100;

const c=
(1-Math.abs(2*l-1))*s;

const x=
c*(1-Math.abs((h/60)%2-1));

const m=
l-c/2;

let r=0,
g=0,
b=0;

if(h<60){

r=c;
g=x;

}

else if(h<120){

r=x;
g=c;

}

else if(h<180){

g=c;
b=x;

}

else if(h<240){

g=x;
b=c;

}

else if(h<300){

r=x;
b=c;

}

else{

r=c;
b=x;

}

return{

r:Math.round((r+m)*255),
g:Math.round((g+m)*255),
b:Math.round((b+m)*255)

};

}


/* =========================================
   MOSTRAR RESULTADO
========================================= */

function mostrar(txt){

result.innerHTML=txt;

}


/* =========================================
   COPIAR CSS
========================================= */

function copiar(txt){

navigator.clipboard.writeText(txt)
.then(()=>alert("CSS copiado"))
.catch(()=>alert("No se pudo copiar automáticamente."));

}

========================================= */

function picker(){

hexToRGB(color);

rgb.r,
rgb.g,
rgb.b

rgb(${rgb.r}, ${rgb.g}, ${rgb.b})

<br>

<b>HSL:</b>
hsl(${hsl[0]}, ${hsl[1]}%, ${hsl[2]}%)

`);

}


/* =========================================
   HEX → RGB
========================================= */

function hexRGB(){

const input=
document.getElementById("hex");

const value=
input.value.replace("#","");

if(!/^[0-9A-Fa-f]{6}$/.test(value)){

return mostrar("HEX inválido.");

}

const c=
hexToRGB(value);

mostrar(`

<b>RGB:</b>

rgb(${c.r}, ${c.g}, ${c.b})

`);

}


/* =========================================
   RGB → HEX
========================================= */

function rgbHEX(){

const R=
Number(document.getElementById("r").value);

const G=
Number(document.getElementById("g").value);

const B=
Number(document.getElementById("b").value);

if(

[R,G,B].some(
v=>isNaN(v)||v<0||v>255
)

){

return mostrar("RGB inválido.");

}

const hexValue=

"#"+
[R,G,B]
.map(
v=>v.toString(16).padStart(2,"0")
)
.join("")
.toUpperCase();

mostrar(`

<b>HEX:</b>
${hexValue}

`);

}


/* =========================================
   HEX → HSL
========================================= */

function hexHSL(){

const value=
document.getElementById("hex").value;

if(!/^#?[0-9A-Fa-f]{6}$/.test(value)){

return mostrar("HEX inválido.");

}

const c=
hexToRGB(value);

const o=
rgbToHSL(
c.r,
c.g,
c.b
);

mostrar(`

<b>HSL:</b>

hsl(${o[0]}, ${o[1]}%, ${o[2]}%)

`);

}


/* =========================================
   HSL → HEX
========================================= */

function hslHEX(){

const h=
Number(document.getElementById("h").value);

const s=
Number(document.getElementById("s").value);

const l=
Number(document.getElementById("l").value);

if(

isNaN(h)||
isNaN(s)||
isNaN(l)||
h<0||
h>360||
s<0||
s>100||
l<0||
l>100

){

return mostrar("Valores HSL inválidos.");

}

const c=
hslToRGB(h,s,l);

const hexValue=

"#"+
[c.r,c.g,c.b]
.map(
v=>v.toString(16).padStart(2,"0")
)
.join("")
.toUpperCase();

mostrar(`

<b>HEX:</b>
${hexValue}

`);

}


/* =========================================
   LUMINANCIA
========================================= */

function luminancia(hexValue){

const c=
hexToRGB(hexValue);

const v=
[c.r,c.g,c.b].map(x=>{

x/=255;

return x<=0.03928

?x/12.92

:Math.pow(
(x+0.055)/1.055,
2.4
);

});

return

0.2126*v[0]+
0.7152*v[1]+
0.0722*v[2];

}


/* =========================================
   CONTRASTE WCAG
========================================= */

function contrast(){

const color1=
document.getElementById("c1").value;

const color2=
document.getElementById("c2").value;

const ratio=

(

(

Math.max(
luminancia(color1),
luminancia(color2)
)+0.05

)

/

(

Math.min(
luminancia(color1),
luminancia(color2)
)+0.05

)

).toFixed(2);

mostrar(`

<b>Contraste: ${ratio}:1</b>

<br><br>

AA:

${ratio>=4.5
?"✅ Cumple"
:"❌ No cumple"}

<br>

AAA:

${ratio>=7
?"✅ Cumple"
:"❌ No cumple"}

`);

}


/* =========================================
   COMPLEMENTARIO
========================================= */

function complementario(){

const color=
document.getElementById("color").value;

const c=
hexToRGB(color);

const comp=

"#"+
[
255-c.r,
255-c.g,
255-c.b
]
.map(
v=>v.toString(16).padStart(2,"0")
)
.join("")
.toUpperCase();

mostrar(`

<div class="color-box"
style="background:${comp}">
</div>

<b>${comp}</b>

`);

}


/* =========================================
   TRIÁDICO
========================================= */

function triadico(){

const color=
document.getElementById("color").value;

const c=
hexToRGB(color);

const hsl=
rgbToHSL(
c.r,
c.g,
c.b
);

let html="";

[0,120,240].forEach(off=>{

const n=
hslToRGB(
(hsl[0]+off)%360,
hsl[1],
hsl[2]
);

const hexValue=

"#"+
[n.r,n.g,n.b]
.map(
v=>v.toString(16).padStart(2,"0")
)
.join("")
.toUpperCase();

html+=`

<div class="color-box"
style="background:${hexValue}">
</div>

<b>${hexValue}</b>

<br>

`;

});

mostrar(html);

}
